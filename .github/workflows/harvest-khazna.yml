name: Harvest Khazna

# Publishes via Trusted Publishers (OIDC) — no HF_TOKEN secret stored.
# The Hub exchanges GitHub's built-in OIDC token for a short-lived,
# repo-scoped Hub token at the start of each run.
#
# One-time setup on the Hub:
#   huggingface.co/datasets/nikeshn/researchbee-data
#     -> Settings -> Trusted Publishers -> Add
#        Provider:   GitHub
#        Repository: <your-org>/<your-repo>
#        Workflow:   harvest-khazna.yml      (pin it — recommended)
#        Branch:     main
#
# UAE is UTC+4 all year (no DST), so 23:00 Dubai == 19:00 UTC.
# GitHub cron is best-effort and may drift 5-30 min under load.

on:
  schedule:
    - cron: "0 19 * * 0"    # Sunday  — FULL harvest (catches withdrawals)
    - cron: "0 19 * * 1-6"  # Mon-Sat — INCREMENTAL
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full harvest"
        type: boolean
        default: false
      skip_upload:
        description: "Harvest only — do not publish"
        type: boolean
        default: false
      with_files:
        description: "Also harvest file/access passes (only once Khazna holds deposits)"
        type: boolean
        default: false

concurrency:
  group: khazna-harvest
  cancel-in-progress: false

env:
  # For non-model repos the resource MUST be prefixed with the repo type.
  HF_OIDC_RESOURCE: datasets/nikeshn/researchbee-data
  HF_DATASET: nikeshn/researchbee-data

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write        # REQUIRED — lets the job request an OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight
        run: |
          echo "## Preflight" >> $GITHUB_STEP_SUMMARY
          if [ ! -f khazna_oai.py ]; then
            echo "❌ \`khazna_oai.py\` not found in the repository root." >> $GITHUB_STEP_SUMMARY
            ls -1 >> $GITHUB_STEP_SUMMARY
            echo "::error::khazna_oai.py missing — see the job summary."
            exit 1
          fi
          echo "✅ khazna_oai.py found" >> $GITHUB_STEP_SUMMARY

      - name: Install dependencies
        run: |
          pip install httpx "huggingface_hub[cli]>=1.19.0"
          hf version

      - name: Verify the harvester runs
        run: |
          python khazna_oai.py --help > /dev/null \
            || { echo "::error::khazna_oai.py failed to start"; exit 1; }
          echo "✅ harvester CLI OK" >> $GITHUB_STEP_SUMMARY

      - name: Endpoint reachable?
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
                 "https://khazna.ku.ac.ae/ws/oai?verb=Identify")
          echo "Khazna OAI returned HTTP $code" >> $GITHUB_STEP_SUMMARY
          [ "$code" = "200" ] || { echo "::error::Khazna OAI unreachable (HTTP $code)"; exit 1; }

      # ── Restore the previous index so incrementals can merge ─────────────
      # The dataset is public, so this read needs no auth at all.
      - name: Restore previous index
        continue-on-error: true
        run: |
          hf download "$HF_DATASET" khazna_index.json last_harvest.txt \
            --repo-type dataset --local-dir . 2>&1 || \
            echo "No previous index — this will be a full harvest."

      - name: Decide mode
        id: mode
        run: |
          DOW=$(date -u +%u)   # 7 = Sunday
          if [ "${{ inputs.full }}" = "true" ] || [ "$DOW" = "7" ] || [ ! -f last_harvest.txt ]; then
            echo "args=" >> $GITHUB_OUTPUT
            echo "mode=FULL" >> $GITHUB_OUTPUT
          else
            echo "args=--from $(cat last_harvest.txt)" >> $GITHUB_OUTPUT
            echo "mode=INCREMENTAL" >> $GITHUB_OUTPUT
          fi

      - name: Harvest (${{ steps.mode.outputs.mode }})
        run: |
          set -o pipefail
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EXTRA=""
          [ "${{ inputs.with_files }}" = "true" ] && EXTRA="--with-files"
          python khazna_oai.py harvest ${{ steps.mode.outputs.args }} $EXTRA 2>&1 | tee harvest.log
          echo "$STARTED" > last_harvest.txt

      - name: Report
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Harvest output (${{ steps.mode.outputs.mode }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -c 4000 harvest.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(no log)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Never publish an empty index over a good one.
      - name: Sanity check
        run: |
          python - <<'PY'
          import json, sys, os
          if not os.path.exists("khazna_index.json"):
              sys.exit("No khazna_index.json was produced.")
          idx = json.load(open("khazna_index.json"))
          print(f"{len(idx):,} DOIs in index")
          if len(idx) < 1000:
              sys.exit(f"Index suspiciously small ({len(idx)}) — refusing to publish.")
          PY

      # ── Publish via Trusted Publishers ───────────────────────────────────
      # The hf CLI detects GitHub Actions, exchanges the OIDC token for a
      # short-lived repo-scoped Hub token, and uses it automatically.
      # HF_OIDC_RESOURCE (set at job level) tells it which repo to scope to.
      - name: Publish to HF Dataset
        if: inputs.skip_upload != true
        run: |
          hf upload "$HF_DATASET" khazna_index.json khazna_index.json \
            --repo-type dataset \
            --commit-message "Khazna harvest ${{ steps.mode.outputs.mode }} ${GITHUB_SHA::7}"
          hf upload "$HF_DATASET" last_harvest.txt last_harvest.txt \
            --repo-type dataset \
            --commit-message "Harvest watermark ${GITHUB_SHA::7}"
          echo "✅ Published to $HF_DATASET via Trusted Publishers" >> $GITHUB_STEP_SUMMARY

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: khazna-harvest
          path: |
            khazna_index.json
            harvest.log
            last_harvest.txt
          if-no-files-found: warn
          retention-days: 14
